name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: Build + test @tekton/cli
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (all workspaces)
        run: npm install --no-audit --no-fund

      - name: Build all workspaces (core must produce dist for cli types)
        run: npm run build

      - name: Test CLI
        run: npm test -w @tekton/cli --if-present

      - name: "Smoke: tekton --help"
        run: node packages/cli/dist/bin/tekton.js --help
