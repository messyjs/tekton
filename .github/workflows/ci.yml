name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: Build + test @tekton/cli
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (cli workspace + root)
        run: npm install -w @tekton/cli --include-workspace-root --no-audit --no-fund

      - name: Build CLI (+ workspace refs)
        run: npm run build -w @tekton/cli

      - name: Test CLI
        run: npm test -w @tekton/cli --if-present

      - name: "Smoke: tekton --help"
        run: node packages/cli/dist/bin/tekton.js --help
