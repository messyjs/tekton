<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEKTON Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/vendor/react.min.js"></script>
<script src="/vendor/react-dom.min.js"></script>
<style>
:root {
  --bg:#020408; --bg2:#070b14; --surface:rgba(10,15,30,0.55); --surface2:rgba(16,22,42,0.7);
  --border:rgba(99,102,241,0.15); --border2:rgba(255,255,255,0.06);
  --neon:#6366f1; --neon-dim:rgba(99,102,241,0.08); --neon-glow:rgba(99,102,241,0.4);
  --green:#22c55e; --green-dim:rgba(34,197,94,0.08); --green-glow:rgba(34,197,94,0.3);
  --red:#ef4444; --red-dim:rgba(239,68,68,0.08); --red-glow:rgba(239,68,68,0.3);
  --amber:#f59e0b; --amber-dim:rgba(245,158,11,0.08); --amber-glow:rgba(245,158,11,0.3);
  --blue:#3b82f6; --purple:#a855f7;
  --text:#e2e8f0; --text2:#64748b; --text3:#334155;
  --mono:'JetBrains Mono',monospace; --sans:'Sora',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
#mesh{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 600px 400px at 20% 20%,rgba(99,102,241,0.18) 0%,transparent 70%),
  radial-gradient(ellipse 500px 500px at 80% 70%,rgba(34,197,94,0.07) 0%,transparent 70%),
  radial-gradient(ellipse 400px 300px at 60% 30%,rgba(139,92,246,0.09) 0%,transparent 70%),
  radial-gradient(ellipse 300px 300px at 40% 80%,rgba(239,68,68,0.04) 0%,transparent 70%);
  animation:meshDrift 25s ease-in-out infinite alternate}
#mesh::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 800px 500px at 70% 50%,rgba(99,102,241,0.1) 0%,transparent 60%);
  animation:meshPulse 8s ease-in-out infinite alternate}
#noise{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.35;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")}

@keyframes meshDrift{0%{transform:scale(1) rotate(0deg)}100%{transform:scale(1.08) rotate(1.5deg)}}
@keyframes meshPulse{0%{opacity:0.5;transform:scale(1)}100%{opacity:0.8;transform:scale(1.15)}}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scoreReveal{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}
@keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 8px var(--neon-glow))}50%{filter:drop-shadow(0 0 24px var(--neon-glow))}}
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes tagSlide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes gaugeFill{from{stroke-dashoffset:502}to{stroke-dashoffset:var(--target-offset)}}
@keyframes barExpand{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.app{display:flex;height:100vh;position:relative;z-index:1}
.sidebar{width:56px;transition:width .3s cubic-bezier(.16,1,.3,1);background:rgba(6,9,18,0.95);
  backdrop-filter:blur(20px) saturate(1.2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:relative;z-index:10;overflow:hidden;flex-shrink:0}
.sidebar:hover{width:200px}
.sidebar-brand{padding:14px 14px 12px;border-bottom:1px solid var(--border);min-height:56px;display:flex;align-items:center;gap:12px;cursor:default}
.brand-logo{width:28px;height:28px;background:linear-gradient(135deg,var(--neon),var(--purple));border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:800;font-size:11px;
  color:#fff;flex-shrink:0;letter-spacing:.5px;box-shadow:0 2px 12px rgba(99,102,241,0.3)}
.brand-label{opacity:0;transition:opacity .2s;white-space:nowrap}
.sidebar:hover .brand-label{opacity:1;transition-delay:.08s}
.brand-name{font-size:13px;font-weight:800;letter-spacing:3px;color:var(--text);
  background:linear-gradient(135deg,var(--text),var(--neon));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand-sub{font-size:7px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;font-family:var(--mono);margin-top:1px}
.nav-list{flex:1;padding:8px 0;overflow-y:auto;overflow-x:hidden}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;color:var(--text2);
  font-size:12px;font-weight:600;transition:all .15s;border-left:2px solid transparent;white-space:nowrap;position:relative}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,0.02)}
.nav-item.active{color:var(--neon);border-left-color:var(--neon);background:var(--neon-dim)}
.nav-item.active::after{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:20px;
  background:var(--neon);border-radius:1px;box-shadow:0 0 8px var(--neon-glow)}
.nav-icon{width:20px;text-align:center;font-size:14px;flex-shrink:0}
.nav-label{opacity:0;transition:opacity .15s;font-weight:600}
.sidebar:hover .nav-label{opacity:1}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border);
  background:rgba(6,9,18,0.9);backdrop-filter:blur(16px) saturate(1.1);flex-shrink:0;min-height:52px;z-index:5}
.topbar-title{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:2.5px;text-transform:uppercase;font-family:var(--mono);flex:1}
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px;animation:slideUp .4s ease}
.gcard{background:var(--surface);backdrop-filter:blur(16px) saturate(1.1);border:1px solid var(--border2);
  border-radius:12px;padding:18px;position:relative;overflow:hidden;
  transition:border-color .3s,box-shadow .3s;animation:slideUp .5s ease both}
.gcard::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;
  background:linear-gradient(180deg,var(--neon),transparent);opacity:.4;transition:opacity .3s}
.gcard::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--neon),transparent);opacity:.15}
.gcard:hover{border-color:rgba(99,102,241,0.3);box-shadow:0 4px 24px rgba(99,102,241,0.06),inset 0 1px 0 rgba(255,255,255,0.03)}
.gcard:hover::before{opacity:.7}
.gcard-green::before{background:linear-gradient(180deg,var(--green),transparent)}
.gcard-red::before{background:linear-gradient(180deg,var(--red),transparent)}
.gcard-amber::before{background:linear-gradient(180deg,var(--amber),transparent)}
.gcard-indigo::before{background:linear-gradient(180deg,var(--neon),transparent)}

.hero{display:flex;align-items:center;gap:32px;padding:28px;margin-bottom:20px;
  background:linear-gradient(135deg,rgba(99,102,241,0.06),transparent 60%);border-radius:16px;
  border:1px solid var(--border);position:relative;animation:scoreReveal .6s ease both}
.hero::before{content:'';position:absolute;inset:0;border-radius:16px;
  background:radial-gradient(ellipse at 30% 50%,rgba(99,102,241,0.08) 0%,transparent 60%);pointer-events:none}

.hero-info{flex:1;min-width:0}
.hero-score-big{font-size:80px;font-weight:800;line-height:.9;font-family:var(--sans);letter-spacing:-4px;
  background:linear-gradient(135deg,var(--neon),#a78bfa,var(--purple));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 4px 24px rgba(99,102,241,0.3))}
.hero-bias{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-top:4px;font-family:var(--sans)}
.hero-price{font-family:var(--mono);font-size:32px;font-weight:700;letter-spacing:-1px;margin-top:8px}
.hero-meta{font-family:var(--mono);font-size:10px;color:var(--text2);line-height:1.6;letter-spacing:.5px;margin-top:2px}
.hero-engine{display:inline-block;padding:3px 10px;border-radius:6px;font-size:9px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;font-family:var(--mono);margin-top:10px;
  border:1px solid rgba(99,102,241,0.3);background:var(--neon-dim);color:var(--neon)}
.hero-market{display:flex;gap:20px;margin-top:12px}
.hero-stat{display:flex;flex-direction:column;gap:2px}
.hero-stat-val{font-family:var(--mono);font-size:13px;font-weight:600}
.hero-stat-lbl{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}

.gauge-wrap{position:relative;width:160px;height:160px;flex-shrink:0;animation:scoreReveal .6s ease both}
.gauge-score{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.gauge-num{font-size:44px;font-weight:800;font-family:var(--sans);letter-spacing:-2px;
  background:linear-gradient(135deg,var(--neon),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gauge-bias{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.gauge-label{font-size:7px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;font-family:var(--mono);margin-top:4px}

.sec-title{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;font-family:var(--sans)}
.sec-title::after{content:'';display:inline-block;width:16px;height:1px;background:var(--neon);margin-left:8px;vertical-align:middle;opacity:.6}

.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:5px;font-size:10px;font-weight:600;
  font-family:var(--mono);letter-spacing:.3px;animation:tagSlide .3s ease both}
.tag-green{background:var(--green-dim);color:var(--green);box-shadow:0 0 8px var(--green-dim)}
.tag-red{background:var(--red-dim);color:var(--red);box-shadow:0 0 8px var(--red-dim)}
.tag-blue{background:rgba(59,130,246,0.08);color:var(--blue)}
.tag-amber{background:var(--amber-dim);color:var(--amber)}
.tag-neon{background:var(--neon-dim);color:var(--neon)}
.tag-purple{background:rgba(168,85,247,0.08);color:var(--purple)}

.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:6px 8px;color:var(--text3);border-bottom:1px solid var(--border);font-size:9px;
  letter-spacing:1px;text-transform:uppercase;font-weight:700;font-family:var(--mono)}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,0.03);font-size:12px}
.tbl tr:hover td{background:rgba(99,102,241,0.03)}

.btn{padding:7px 16px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:all .15s}
.btn-neon{background:linear-gradient(135deg,var(--neon),#4f46e5);color:#fff;box-shadow:0 2px 12px rgba(99,102,241,0.3)}
.btn-neon:hover{box-shadow:0 4px 20px rgba(99,102,241,0.4);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{color:var(--text);border-color:var(--neon)}

.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:60px 20px}
.loading-text{font-size:11px;font-weight:700;color:var(--neon);letter-spacing:2px;text-transform:uppercase;font-family:var(--mono);animation:breathe 2s ease-in-out infinite}

.level-bar-track{height:28px;background:rgba(255,255,255,0.02);border-radius:4px;position:relative;overflow:hidden;margin-bottom:4px}
.level-bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding:0 10px;font-size:10px;font-weight:600;
  font-family:var(--mono);color:#fff;letter-spacing:.3px;transform-origin:left;animation:barExpand .6s ease both}
.level-bar-price{font-family:var(--mono);font-size:11px;font-weight:600}
.level-bar-name{font-family:var(--sans);font-size:10px;color:var(--text2)}

.engine-pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);
  font-size:10px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:all .2s;letter-spacing:.3px}
.pill:hover{border-color:var(--neon);color:var(--text);background:var(--neon-dim)}
.pill.active{border-color:var(--neon);color:var(--neon);background:var(--neon-dim);box-shadow:0 0 12px rgba(99,102,241,0.2)}

.tick-cat{font-size:8px;font-weight:700;color:var(--text3);letter-spacing:2px;text-transform:uppercase;padding:8px 8px 4px;user-select:none}
.tick-item{padding:6px 10px;cursor:pointer;border-radius:4px;font-size:12px;font-family:var(--mono);font-weight:500;transition:background .15s}
.tick-item:hover{background:rgba(255,255,255,0.04)}
.tick-item.sel{background:var(--neon-dim);color:var(--neon);font-weight:700}

.chat-msg{padding:10px 14px;border-radius:12px;max-width:80%;font-size:13px;line-height:1.6;animation:slideUp .2s ease both}
.chat-msg-user{background:linear-gradient(135deg,var(--neon-dim),rgba(99,102,241,0.15));color:var(--text);align-self:flex-end;border:1px solid rgba(99,102,241,0.2)}
.chat-msg-ai{background:var(--surface);color:var(--text);align-self:flex-start;border:1px solid var(--border2)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat-card{padding:16px;border-radius:10px;background:rgba(255,255,255,0.02);border:1px solid var(--border2);text-align:center}
.stat-val{font-size:28px;font-weight:800;font-family:var(--sans);letter-spacing:-1px}
.stat-lbl{font-size:8px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:2px;margin-top:4px}

.conf-bar{height:24px;border-radius:3px;display:flex;align-items:center;padding:0 8px;font-size:9px;font-weight:600;
  font-family:var(--mono);color:#fff;letter-spacing:.3px;transform-origin:left;animation:barExpand .6s ease both;min-width:30px}

.empty{display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--text3)}
input,select,textarea{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;
  padding:8px 14px;color:var(--text);font-size:13px;font-family:var(--sans);outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--neon);box-shadow:0 0 0 3px var(--neon-dim)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(99,102,241,0.15);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(99,102,241,0.35)}
</style>
</head>
<body>
<div id="mesh"></div>
<div id="noise"></div>
<div id="root" style="position:relative;z-index:1"></div>
<script>
var e = React.createElement;
var S = React.useState;
var E = React.useEffect;
var R = React.useRef;

var API = window.location.origin;
var ENGINE_COLORS = {gann:'#6366f1',casper:'#a855f7',mj:'#f59e0b',ict:'#10b981',rumors:'#f97316',geo:'#3b82f6',franky:'#f59e0b',cryptoface:'#a855f7',buffett:'#3b82f6',quant:'#f43f5e',tori:'#14b8a6'};
var ENGINE_NAMES = {gann:'W.D. Gann',casper:'Jayson Casper',rumors:'The Rumors',geo:'Trader Geo',ict:'ICT / Smart Money',mj:'Messy Jesse',franky:'Frankie Candles',cryptoface:'CryptoFace',buffett:'Warren Buffett',quant:'QuantCrawler',tori:'Tori Trades',dtr:'DayTrader',reece:'Ultimate Scalper'};

function api(path) { return fetch(API + path).then(function(r){return r.json();}).catch(function(){return null;}); }
function apiPost(path, body) { return fetch(API + path, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();}).catch(function(){return null;}); }
function fmtPrice(p) { if(typeof p!=='number')return'-'; if(p<1)return p.toFixed(8); if(p<100)return p.toFixed(4); return p.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

function LoadingDots() {
  return e('div', {className:'loading-wrap'},
    e('div', {style:{display:'flex',gap:8}}, [0,1,2].map(function(i){
      return e('div', {key:i, style:{width:10,height:10,borderRadius:'50%',background:'var(--neon)',animation:'breathe 1.4s ease-in-out infinite',animationDelay:(i*0.2)+'s'}});
    })),
    e('div', {className:'loading-text'}, 'ANALYZING')
  );
}

/* === SVG Circular Gauge === */
function ScoreGauge(props) {
  var score = props.score || 0;
  var bias = props.bias || 'NEUTRAL';
  var engineColor = props.color || '#6366f1';
  var size = props.size || 160;
  var strokeWidth = props.strokeWidth || 10;
  var r = (size - strokeWidth * 2) / 2;
  var circumference = 2 * Math.PI * r;
  var offset = circumference * (1 - score / 100);
  var biasColor = bias.indexOf('BULL') >= 0 ? '#22c55e' : bias.indexOf('BEAR') >= 0 ? '#ef4444' : '#f59e0b';
  var biasShort = bias.replace(/_/g, ' ');
  if (biasShort.length > 20) biasShort = biasShort.substring(0, 20);
  var center = size / 2;
  return e('div', {className:'gauge-wrap', style:{width:size,height:size}},
    e('svg', {width:size, height:size, viewBox:'0 0 ' + size + ' ' + size},
      e('defs', null,
        e('linearGradient', {id:'gaugeGrad', x1:'0%', y1:'0%', x2:'100%', y2:'100%'},
          e('stop', {offset:'0%', stopColor:score >= 70 ? '#22c55e' : score >= 40 ? '#f59e0b' : '#ef4444'}),
          e('stop', {offset:'100%', stopColor:engineColor})
        )
      ),
      /* Background track */
      e('circle', {cx:center, cy:center, r:r, fill:'none', stroke:'rgba(255,255,255,0.04)', strokeWidth:strokeWidth}),
      /* Score arc */
      e('circle', {cx:center, cy:center, r:r, fill:'none', stroke:'url(#gaugeGrad)', strokeWidth:strokeWidth,
        strokeLinecap:'round', strokeDasharray:circumference, strokeDashoffset:offset,
        transform:'rotate(-90 ' + center + ' ' + center + ')',
        style:{transition:'stroke-dashoffset 1.5s cubic-bezier(0.16,1,0.3,1)'}}),
      /* Tick marks */
      [0,25,50,75].map(function(tick) {
        var angle = (tick / 100 * 360 - 90) * Math.PI / 180;
        var x1 = center + (r + strokeWidth/2 + 4) * Math.cos(angle);
        var y1 = center + (r + strokeWidth/2 + 4) * Math.sin(angle);
        var x2 = center + (r + strokeWidth/2 + 8) * Math.cos(angle);
        var y2 = center + (r + strokeWidth/2 + 8) * Math.sin(angle);
        return e('line', {key:tick, x1:x1, y1:y1, x2:x2, y2:y2, stroke:'rgba(255,255,255,0.1)', strokeWidth:1.5, strokeLinecap:'round'});
      })
    ),
    e('div', {className:'gauge-score'},
      e('div', {className:'gauge-num'}, String(score)),
      e('div', {className:'gauge-bias', style:{color:biasColor}}, biasShort),
      e('div', {className:'gauge-label'}, 'SCORE')
    )
  );
}

/* === Hero Block (redesigned with gauge) === */
function HeroBlock(props) {
  var d = props.data;
  if (!d) return e('div', {className:'hero'}, e(LoadingDots));
  var eng = props.engine || d.engine || 'gann';
  var score = d.gannScore != null ? d.gannScore : (d.score != null ? d.score : 0);
  var bias = d.gannBias || d.bias || 'NEUTRAL';
  var price = d.currentPrice || d.price || 0;
  var ticker = d.symbol || d.ticker || 'BTCUSDT';
  var engineColor = ENGINE_COLORS[eng] || '#6366f1';
  var engineName = ENGINE_NAMES[eng] || eng.toUpperCase();
  var biasColor = bias.indexOf('BULL') >= 0 ? 'var(--green)' : bias.indexOf('BEAR') >= 0 ? 'var(--red)' : 'var(--amber)';
  var market = d.market || {};

  return e('div', {className:'hero'},
    /* Gauge */
    e(ScoreGauge, {score:score, bias:bias, color:engineColor, size:160, strokeWidth:10}),
    /* Info */
    e('div', {className:'hero-info'},
      e('div', {className:'hero-engine', style:{borderColor:engineColor+'66',background:engineColor+'15',color:engineColor}}, engineName + ' ENGINE'),
      e('div', {className:'hero-price'}, fmtPrice(price)),
      e('div', {className:'hero-meta'}, ticker + '\u00A0\u00A0|\u00A0\u00A0' + (market.exchange || 'OKX') + '\u00A0\u00A0|\u00A0\u00A0' + (d.timeframe || '4H')),
      /* Market stats */

    e('div', {style:{display:'flex',gap:8,flexWrap:'wrap',marginTop:8}},
      e('input', {value:ticker, onChange:function(ev){setTicker(ev.target.value);}, placeholder:'TICKER (e.g. NVDA)', style:{flex:1,minWidth:120,fontFamily:'var(--mono)'}}),
      e('input', {value:dateInput, onChange:function(ev){setDateInput(ev.target.value);}, placeholder:'Date (optional)', style:{flex:1,minWidth:120}}),
      e('button', {onClick:runAnalyze, disabled:loading==='running', className:'btn ' + (loading==='running'?'btn-ghost':'btn-neon'), style:{minWidth:100}}, loading==='running' ? 'Analyzing...' : 'Analyze')
    ),
    loading === 'running' ? e('div', {style:{marginTop:12,textAlign:'center'}}, e(LoadingDots)) : null
  );

  var resultCard = result ? e('div', {className:'gcard', style:{marginBottom:16}},
    e('div', {className:'sec-title'}, result.error ? 'Error' : 'Analysis Result'),
    result.error ? e('div', {style:{color:'var(--red)',fontSize:13,lineHeight:1.6}}, result.message || 'Unknown error') : e('div', {style:{fontSize:13,lineHeight:1.8,whiteSpace:'pre-wrap'}}, [
      result.decision ? '**Decision:** ' + String(result.decision).slice(0, 3000) : null,
      result.ticker ? '\n\n**Ticker:** ' + result.ticker : null,
      result.date ? '\n**Date:** ' + result.date : null,
      result.provider ? '\n**Provider:** ' + result.provider : null,
      result.deep_llm ? '\n**Deep Think:** ' + result.deep_llm : null,
      result.quick_llm ? '\n**Quick Think:** ' + result.quick_llm : null,
      '\n\n_' + (result.timestamp || new Date().toISOString()) + '_'
    ].filter(Boolean).join(''))
  ) : null;

  var historyCard = history && history.results && history.results.length > 0 ? e('div', {className:'gcard'},
    e('div', {className:'sec-title'}, 'History (' + (history.ticker || ticker) + ')'),
    e('table', {className:'tbl'},
      e('thead', null, e('tr', null, e('th', null, 'Date'), e('th', null, 'Decision'))),
      e('tbody', null, history.results.slice(0, 10).map(function(r, i) {
        return e('tr', {key:i},
          e('td', {style:{fontSize:11,fontFamily:'var(--mono)'}}, r.date || '?'),
          e('td', {style:{fontSize:12}}, (r.decision || '?').slice(0, 120))
        );
      }))
    )
  ) : null;

  return e('div', {className:'page'},
    e('div', {style:{marginBottom:20}},
      e('span', {style:{fontSize:28,fontWeight:800,background:'linear-gradient(135deg,var(--neon),var(--purple))',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}, 'MessyHedge'),
      e('span', {style:{fontSize:10,fontWeight:700,color:'var(--text3)',letterSpacing:2,textTransform:'uppercase',marginLeft:12,fontFamily:'var(--mono)'}}, 'MULTI-AGENT TRADING')
    ),
    statusCard,
    analyzeInput,
    resultCard,
    historyCard
  );
}

function App() {
  var ps = S('analysis'); var page = ps[0]; var setPage = ps[1];
  var ts = S('BTCUSDT'); var ticker = ts[0]; var setTicker = ts[1];
  var es = S(null); var engines = es[0]; var setEngines = es[1];
  var as2 = S('gann'); var activeEngine = as2[0]; var setActiveEngine = as2[1];
  E(function(){
    api('/api/engines').then(function(d){if(d&&d.engines){setEngines(d.engines);setActiveEngine(d.default||'gann');}});
  },[]);

  var navItems = [
    {id:'analysis',icon:'\u25A6',label:'Analysis'},
    {id:'chat',icon:'\u2751',label:'Chat'},
    {id:'design',icon:'\u25CE',label:'Design'}
  ];

  function renderPage() {
    if (page === 'chat') return e(ChatPage, {ticker:ticker, engine:activeEngine});
    if (page === 'design') return e('div', {className:'page'},
      e('div', {className:'gcard'}, e('a', {href:'http://localhost:7799/?page=design', target:'_blank', style:{color:'var(--neon)',fontWeight:600}}, 'Open Design Tool \u2192'))
    );
    return e(AnalysisPage, {ticker:ticker, engine:activeEngine});
  }

  return e('div', {className:'app'},
    e('div', {className:'sidebar'},
      e('div', {className:'sidebar-brand'},
        e('div', {className:'brand-logo'}, 'TK'),
        e('div', {className:'brand-label'},
          e('div', {className:'brand-name'}, 'TEKTON'),
          e('div', {className:'brand-sub'}, 'Command Center')
        )
      ),
      e('div', {className:'nav-list'},
        navItems.map(function(pg){
          return e('div', {key:pg.id, className:'nav-item'+(page===pg.id?' active':''), onClick:function(){setPage(pg.id);}},
            e('span', {className:'nav-icon'}, pg.icon),
            e('span', {className:'nav-label'}, pg.label)
          );
        })
      )
    ),
    e('div', {className:'main'},
      e('div', {className:'topbar'},
        e('div', {className:'topbar-title'}, 'TEKTON'),
        engines ? e(EngineSelector, {engines:engines.map(function(e){return e.id||e;}), active:activeEngine, onChange:setActiveEngine}) : null,
        e(TickerDropdown, {ticker:ticker, onChange:setTicker})
      ),
      renderPage()
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
